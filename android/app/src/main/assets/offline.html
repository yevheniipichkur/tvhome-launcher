<!doctype html><html lang="uk"><meta charset="utf-8"><title>Вітальня</title>
<style>html,body{margin:0;height:100%;background:#0b1017;color:#f1ece2;font-family:sans-serif}
main{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;font-size:3vw;line-height:1.6}
b{color:#f4a640;font-weight:500}.m{color:#8f98a6;font-size:2vw}</style>
<main><div><b>Вітальня</b> чекає на сервер…</div>
<div class="m">сторінка з Pi (192.168.1.16:8098) ще недоступна · повернуся сама, щойно вона відповість</div>
<div class="m">ОК — налаштування мережі</div></main>
<script>
// Retry from the page itself as well: right after a reboot the launcher's own retry can keep
// failing while the WebView still believes the network is down.
var HOME = 'http://192.168.1.16:8098/';
function check() {
  fetch(HOME + 'healthz?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
    .then(function () { location.replace(HOME); })
    .catch(function () { setTimeout(check, 5000); });
}
setTimeout(check, 3000);
document.addEventListener('keydown', function (e) { if (e.keyCode === 13 || e.keyCode === 23) { window.TV && TV.openSettings('wifi'); } });
</script>
</html>

workflows:
  tvhome-apk:
    name: TVHome launcher APK
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - tvhome_signing
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Signing
        script: |
          set -eu
          echo "$TVHOME_KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/tvhome.jks"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/tvhome.jks" >> "$CM_ENV"
      - name: Build release APK
        working_directory: android
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease
    artifacts:
      - android/app/build/outputs/apk/*/release/*.apk

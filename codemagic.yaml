workflows:
  tvhome-apk:
    name: TVHome launcher APK
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - tvhome_signing
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Signing
        script: |
          set -eu
          echo "$TVHOME_KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/tvhome.jks"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/tvhome.jks" >> "$CM_ENV"
      - name: Build release APK
        working_directory: android
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease
      - name: Check TV match screen
        script: |
          set -eu
          npm install --prefix "$CM_BUILD_DIR/.ci-web" --ignore-scripts playwright@1.62.1
          "$CM_BUILD_DIR/.ci-web/node_modules/.bin/playwright" install chromium
          PLAYWRIGHT_PATH="$CM_BUILD_DIR/.ci-web/node_modules/playwright" node tools/test/cinema-celebration-ui.cjs
    artifacts:
      - android/app/build/outputs/apk/*/release/*.apk
      - .impeccable/review/celebration-*.png
